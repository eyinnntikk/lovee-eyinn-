<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Pretty Girl ♡</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: 'Quicksand', sans-serif;
  background: linear-gradient(135deg, #fff0f5, #ffdce8, #fff5f8);
  color: #b45e7c;
  overflow-x: hidden;
}

.container {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px 16px;
}

.card {
  width: 100%;
  max-width: 430px;
  background: rgba(255,255,255,0.8);
  border: 2px solid white;
  border-radius: 30px;
  padding: 32px 23px;
  text-align: center;
  box-shadow: 0 10px 35px #df8ba933;
  position: relative;
  z-index: 2;
}

.bow {
  font-size: 60px;
  animation: wiggle 2s infinite ease-in-out;
}

@keyframes wiggle {
  0%, 100% { transform: rotate(-8deg); }
  50% { transform: rotate(8deg); }
}

h1 {
  font-family: 'Dancing Script', cursive;
  color: #df7398;
  font-size: clamp(42px, 12vw, 58px);
  margin: 12px 0;
}

h2 {
  font-family: 'Dancing Script', cursive;
  font-size: 37px;
  color: #df7398;
  margin-bottom: 15px;
}

p {
  font-size: 14px;
  line-height: 1.9;
}

.name {
  background: #ffe2ed;
  border-radius: 30px;
  display: inline-block;
  padding: 10px 18px;
  margin: 12px 0;
  font-weight: 700;
}

button {
  background: #e77fa1;
  color: white;
  border: none;
  border-radius: 30px;
  padding: 13px 22px;
  font-family: inherit;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 5px 14px #e77fa144;
  transition: 0.2s;
  margin-top: 20px;
}

button:active {
  transform: scale(0.95);
}

#surprise {
  display: none;
  animation: appear 0.8s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.love-letter {
  background: #fff4f8;
  border-radius: 20px;
  padding: 20px 17px;
  text-align: left;
  line-height: 2;
  font-size: 14px;
}

.signature {
  font-family: 'Dancing Script', cursive;
  font-size: 29px;
  margin-top: 20px;
  color: #dc7197;
}

.heart {
  position: fixed;
  bottom: -30px;
  pointer-events: none;
  z-index: 5;
  animation: fly 5s linear forwards;
}

@keyframes fly {
  to {
    transform: translateY(-110vh) rotate(30deg);
    opacity: 0;
  }
}

footer {
  margin-top: 25px;
  font-size: 12px;
  color: #cb91a6;
}

@media (max-width: 380px) {
  .card { padding: 27px 17px; }
  p, .love-letter { font-size: 13px; }
}
</style>
</head>

<body>

<div class="container">
  <main class="card">

    <section id="home">
      <div class="bow">🎀</div>

      <p>♡ A LITTLE MESSAGE FOR YOU ♡</p>

      <h1>I Love You</h1>

      <div class="name">buat cantikku 💗</div>

      <p style="margin-top:15px">
        haii, perempuan paling cantik kesayanganku!<br>
        aku punya sesuatu buat kamu nihh 🥹
        <br><br>
        jangan lupa senyum dulu, yaa ♡
      </p>

      <button onclick="openLove()">
        buka suratnya 💌
      </button>
    </section>

    <section id="surprise">
      <div class="bow">💗</div>
      <p>♡ ESPECIALLY FOR YOU ♡</p>
      <h2>Dear, My Pretty Girl</h2>

      <div class="love-letter" id="letter"></div>

      <div class="signature">
        i love you, always ♡
      </div>

      <button onclick="moreLove()">
        pencet lagi, cantik 💋
      </button>
    </section>

    <footer>
      made with love, just for you ♡
    </footer>

  </main>
</div>

<script>
const loveMessage = `haii eyinn sayanggg ♡

aku cuma mau bilang kalau aku sayang
banget sama kamu. lebih dari yang bisa
aku jelasin lewat kata-kata.

makasih yaa udah hadir di hidup aku.
makasih udah jadi seseorang yang bisa
bikin hari-hari aku terasa lebih indah.
bahkan hal kecil dari kamu aja kadang
udah cukup buat bikin aku senyum sendiri.

cantik, jangan pernah ngerasa kamu
kurang berharga, yaa. kamu itu berharga,
kamu itu istimewa, dan kamu pantas
mendapatkan semua hal baik di dunia ini.

kalau suatu hari kamu capek, istirahat
dulu, yaa. kamu nggak harus selalu kuat.
kalau dunia terasa berat, semoga kamu
selalu ingat kalau kamu layak disayang,
didengar, dan diperlakukan dengan baik.

aku mungkin nggak selalu bisa bikin
semuanya sempurna, tapi aku harap
kamu selalu punya alasan buat tersenyum.

please, keep that pretty smile of yours.
jangan lupa makan, istirahat yang cukup,
dan sayang sama diri kamu sendiri juga.

kalau aku boleh minta satu hal,
aku mau kamu bahagia.
hari ini, besok, dan seterusnya.

you are my favorite person,
my pretty girl, my little happiness.

i love you so, so much eyinn ntikk.
more than words can ever explain. ♡`;

function openLove() {
  document.getElementById("home").style.display = "none";
  document.getElementById("surprise").style.display = "block";
  document.getElementById("letter").textContent = loveMessage;

  makeHearts(35);

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function moreLove() {
  makeHearts(45);

  const messages = [
    "I LOVE YOU SO MUCH, CANTIKK!! 💗",
    "you are my favorite notification 💌",
    "sini peluk virtual duluu 🫂💕",
    "cantik banget, siapa punya? AKU! 🎀",
    "jangan lupa kalau kamu disayang yaa ♡"
  ];

  const random = messages[
    Math.floor(Math.random() * messages.length)
  ];

  alert(random);
}

function makeHearts(total) {
  for (let i = 0; i < total; i++) {
    setTimeout(() => {
      const heart = document.createElement("div");
      heart.className = "heart";

      const icons = ["💗", "💕", "♡", "💖", "🎀"];
      heart.textContent =
        icons[Math.floor(Math.random() * icons.length)];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (16 + Math.random() * 20) + "px";
      heart.style.animationDuration = (3 + Math.random() * 3) + "s";

      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 6500);
    }, i * 80);
  }
}

// Hati kecil terus melayang
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = Math.random() > 0.5 ? "♡" : "💕";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = "18px";

  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 5000);
}, 1200);
</script>

</body>
</html>
